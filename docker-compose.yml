services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-document-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/eval:/app/eval
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload